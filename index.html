<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #0066cc; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo! Selamat Datang</h1>
        <p>Ini adalah website pertama saya yang berhasil dibuat!</p>
    </div>
</body>
</html>
